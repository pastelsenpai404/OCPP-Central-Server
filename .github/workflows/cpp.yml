name: C++ validation
on:
  push:
    paths: ['cpp/**', '.github/workflows/cpp.yml']
  pull_request:
    paths: ['cpp/**', '.github/workflows/cpp.yml']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libjsoncpp-dev zlib1g-dev libmariadb-dev libssl-dev uuid-dev ninja-build
      - name: Configure
        run: cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DOCPP_SANITIZERS=ON
      - name: Build
        run: cmake --build cpp/build --parallel 2
      - name: Core checks
        run: ctest --test-dir cpp/build --output-on-failure
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and core checks
        shell: powershell
        run: ./cpp/scripts/build-windows.ps1
